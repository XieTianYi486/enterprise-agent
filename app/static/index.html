<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>企业办公 Agent</title>
<style>
  :root {
    --bg1: #eef2ff;
    --bg2: #fdf2f8;
    --card: rgba(255, 255, 255, 0.72);
    --border: rgba(99, 102, 241, 0.14);
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --user: #4f46e5;
    --user-text: #ffffff;
    --assistant: #f1f5f9;
    --text: #1e293b;
    --muted: #64748b;
    --chip: rgba(79, 70, 229, 0.08);
    --chip-text: #4338ca;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background: linear-gradient(120deg, var(--bg1), var(--bg2));
    color: var(--text);
  }

  .card {
    width: 100%;
    max-width: 760px;
    height: 92vh;
    display: flex;
    flex-direction: column;
    border-radius: 20px;
    background: var(--card);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--border);
    box-shadow: 0 24px 60px -18px rgba(79, 70, 229, 0.28);
    overflow: hidden;
  }

  header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
  }

  header p {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--muted);
  }

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 11px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.65;
    white-space: normal;
    word-break: break-word;
    animation: pop 0.18s ease;
  }

  .user .bubble {
    background: var(--user);
    color: var(--user-text);
    border-bottom-right-radius: 5px;
  }

  .assistant .bubble {
    background: var(--assistant);
    border-bottom-left-radius: 5px;
  }

  .steps {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding-left: 2px;
  }

  .chip {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--chip);
    color: var(--chip-text);
    font-family: "SFMono-Regular", Consolas, monospace;
  }

  .pending {
    background: #fffbeb;
    border: 1px solid #fde68a;
  }

  .pending-summary {
    font-size: 14px;
    margin-bottom: 10px;
    color: #92400e;
  }

  .pending-actions { display: flex; gap: 10px; }

  .btn {
    border: none;
    cursor: pointer;
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn.ok { background: var(--primary); color: #fff; }
  .btn.ok:hover { background: var(--primary-dark); }
  .btn.no { background: #e2e8f0; color: #475569; }

  .input-bar {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.5);
  }

  .input-bar input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 14px;
    outline: none;
    background: #fff;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .input-bar input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
  }

  .send {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .send:hover { background: var(--primary-dark); }
  .send:active { transform: scale(0.96); }
  .send:disabled { opacity: 0.55; cursor: not-allowed; }

  .toolbar { display: flex; align-items: center; gap: 12px; }
  .new-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .new-btn:hover { color: var(--primary); border-color: var(--primary); }

  .spinner {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    padding: 0 6px;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--primary);
    animation: blink 1.2s infinite ease-in-out;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
</style>
</head>
<body>
  <div class="card">
    <header>
      <h1>企业办公 Agent</h1>
      <p>演示账号 demo / demo123456 · 支持请假、报销、审批查询、制度咨询</p>
    </header>

    <div class="chat" id="chat">
      <div class="row assistant">
        <div class="bubble">你好，我是企业办公助手。可以问我：<br>「我今年还有几天年假？」<br>「帮我请下周三到周五的年假，回老家」<br>「帮我报销 2000 元差旅费」</div>
      </div>
    </div>

    <div class="input-bar">
      <input id="input" type="text" placeholder="输入消息，回车发送…" autocomplete="off" />
      <button class="toolbar new-btn" id="newBtn">新对话</button>
      <span class="spinner" id="spinner" style="display:none">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </span>
      <button class="send" id="sendBtn">发送</button>
    </div>
  </div>

<script>
  let conversationId = null;
  const chatEl = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const newBtn = document.getElementById('newBtn');
  const spinner = document.getElementById('spinner');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function nl2br(s) { return esc(s).split('\n').join('<br>'); }

  function scrollBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

  function addBubble(role, html) {
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const b = document.createElement('div');
    b.className = 'bubble';
    b.innerHTML = html;
    row.appendChild(b);
    chatEl.appendChild(row);
    scrollBottom();
  }
  function addUser(text) { addBubble('user', nl2br(text)); }
  function addAssistant(text) { addBubble('assistant', nl2br(text)); }

  function addSteps(steps) {
    if (!steps || !steps.length) return;
    const names = steps.map(s => s.tool).filter(Boolean);
    if (!names.length) return;
    const row = document.createElement('div');
    row.className = 'row assistant';
    row.innerHTML = '<div class="steps">' +
      names.map(n => '<span class="chip">' + esc(n) + '</span>').join('') + '</div>';
    chatEl.appendChild(row);
    scrollBottom();
  }

  function addPending(pending) {
    const row = document.createElement('div');
    row.className = 'row assistant';
    const b = document.createElement('div');
    b.className = 'bubble pending';
    b.innerHTML =
      '<div class="pending-summary">' + nl2br(pending.summary || '') + '</div>' +
      '<div class="pending-actions">' +
        '<button class="btn ok" data-act="confirm">确认提交</button>' +
        '<button class="btn no" data-act="reject">取消</button>' +
      '</div>';
    row.appendChild(b);
    chatEl.appendChild(row);
    scrollBottom();

    b.querySelector('[data-act="confirm"]').onclick = () => doConfirm(pending.action_id, true, b);
    b.querySelector('[data-act="reject"]').onclick = () => doConfirm(pending.action_id, false, b);
  }

  async function doConfirm(actionId, approved, pendingEl) {
    setLoading(true);
    try {
      const res = await fetch('/api/v1/chat/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conversation_id: conversationId, action_id: actionId, approved })
      });
      const data = await res.json();
      if (!res.ok) { addAssistant('错误：' + (data.message || data.detail || res.status)); return; }
      pendingEl.querySelector('.pending-actions').style.display = 'none';
      addSteps(data.steps);
      addAssistant(data.answer || '(无返回)');
    } catch (e) {
      addAssistant('请求失败：' + e.message);
    } finally {
      setLoading(false);
    }
  }

  function setLoading(on) {
    sendBtn.disabled = on;
    spinner.style.display = on ? 'inline-flex' : 'none';
  }

  async function send() {
    const msg = input.value.trim();
    if (!msg || sendBtn.disabled) return;
    addUser(msg);
    input.value = '';
    setLoading(true);
    try {
      const body = { message: msg };
      if (conversationId) body.conversation_id = conversationId;
      const res = await fetch('/api/v1/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) { addAssistant('错误：' + (data.message || data.detail || res.status)); return; }
      conversationId = data.conversation_id;
      addSteps(data.steps);
      if (data.status === 'awaiting_confirmation' && data.pending) {
        addPending(data.pending);
      } else {
        addAssistant(data.answer || '(无返回)');
      }
    } catch (e) {
      addAssistant('请求失败：' + e.message);
    } finally {
      setLoading(false);
    }
  }

  sendBtn.onclick = send;
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  newBtn.onclick = () => {
    conversationId = null;
    chatEl.innerHTML =
      '<div class="row assistant"><div class="bubble">已开始新对话，请输入你的问题…</div></div>';
    input.focus();
  };
</script>
</body>
</html>
